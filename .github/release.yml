# Read by `gh release create --generate-notes`; a PR is listed under the first category it matches.
# type:* labels are applied at release time from PR titles (.github/scripts/release_labels.sh).
changelog:
  categories:
    - title: Breaking Changes
      labels:
        - type:breaking
    - title: Major Changes
      labels:
        - major-change
    - title: New Features
      labels:
        - type:feature
    - title: Bug Fixes
      labels:
        - type:bug
    - title: Documentation
      labels:
        - type:docs
    - title: Maintenance
      labels:
        - type:maintenance
    - title: Other Changes
      labels:
        - "*"
