name: PR Checks
on:
  pull_request:
    # synchronize: a required check must report on every head commit.
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]
permissions:
  contents: read
  pull-requests: read
# Dependabot labels a PR just after opening it; cancel the superseded run so its failure doesn't linger.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  release-notes:
    name: Release Notes Labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Check PR title is a conventional commit
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: .github/scripts/release_labels.sh "$PR_TITLE"
      - name: Check PR has exactly one of major-change or minor-change
        # Runs even after a title failure, so both problems are reported in one pass.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # Not the event payload's labels: they go stale when labels land after the event, and re-runs replay them.
          labels="$(gh pr view "$PR_URL" --json labels --jq '[.labels[].name]')"
          count="$(jq '[.[] | select(. == "major-change" or . == "minor-change")] | length' <<< "$labels")"
          if [[ "$count" -ne 1 ]]; then
            echo "Add exactly one of the major-change or minor-change labels. Current labels: $labels" >&2
            exit 1
          fi
