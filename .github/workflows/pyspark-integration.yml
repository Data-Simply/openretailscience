name: PySpark Integration Tests

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  integration-tests:
    name: Run PySpark Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      # Spark 3.5 fails to start on JDK 23+ (Subject.getSubject throws), and ubuntu-latest defaults to JDK 25
      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install Dependencies
        run: |
          uv sync --locked --group integration

      - name: Run Integration Tests
        run: |
          uv run pytest tests/integration -k "pyspark" -v
