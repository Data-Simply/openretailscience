name: PyPi Package Deploy
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "release"
  cancel-in-progress: false
jobs:
  pre-commit:
    name: Pre-Commit Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Run Pre-commit
        run: uv run pre-commit run --all-files

  security-audit:
    name: Dependency Security Audit
    uses: $/.github/workflows/security-audit.yml
    permissions:
      contents: read
      security-events: write

  bigquery-integration-tests:
    name: BigQuery Integration Tests
    uses: $/.github/workflows/bigquery-integration.yml
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

  databricks-integration-tests:
    name: Databricks Integration Tests
    uses: $/.github/workflows/databricks-integration.yml
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      GCP_INFRA_PROJECT_ID: ${{ secrets.GCP_INFRA_PROJECT_ID }}
      DATABRICKS_CI_HOST: ${{ secrets.DATABRICKS_CI_HOST }}
      DATABRICKS_CI_CLIENT_ID: ${{ secrets.DATABRICKS_CI_CLIENT_ID }}
      DATABRICKS_CI_HTTP_PATH: ${{ secrets.DATABRICKS_CI_HTTP_PATH }}
      DATABRICKS_CI_CATALOG: ${{ secrets.DATABRICKS_CI_CATALOG }}
      DATABRICKS_CI_SCHEMA: ${{ secrets.DATABRICKS_CI_SCHEMA }}

  pyspark-integration-tests:
    name: PySpark Integration Tests
    uses: $/.github/workflows/pyspark-integration.yml

  snowflake-integration-tests:
    name: Snowflake Integration Tests
    uses: $/.github/workflows/snowflake-integration.yml
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      GCP_INFRA_PROJECT_ID: ${{ secrets.GCP_INFRA_PROJECT_ID }}
      SNOWFLAKE_CI_ACCOUNT: ${{ secrets.SNOWFLAKE_CI_ACCOUNT }}
      SNOWFLAKE_CI_USER: ${{ secrets.SNOWFLAKE_CI_USER }}
      SNOWFLAKE_CI_WAREHOUSE: ${{ secrets.SNOWFLAKE_CI_WAREHOUSE }}
      SNOWFLAKE_CI_DATABASE: ${{ secrets.SNOWFLAKE_CI_DATABASE }}
      SNOWFLAKE_CI_SCHEMA: ${{ secrets.SNOWFLAKE_CI_SCHEMA }}

  sqlserver-integration-tests:
    name: SQL Server Integration Tests
    uses: $/.github/workflows/sqlserver-integration.yml

  oracle-integration-tests:
    name: Oracle Integration Tests
    uses: $/.github/workflows/oracle-integration.yml

  multi-python-tests:
    name: Multi-Python Version Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: |
          uv sync --locked
      - name: Run tests (excluding integration)
        run: |
          uv run pytest tests/ --ignore=tests/integration --tb=short -v

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - security-audit
      - pre-commit
      - bigquery-integration-tests
      - databricks-integration-tests
      - pyspark-integration-tests
      - snowflake-integration-tests
      - sqlserver-integration-tests
      - oracle-integration-tests
      - multi-python-tests
    permissions:
      contents: write
      id-token: write
      attestations: write
      pull-requests: write
    env:
      CI_COMMIT_MESSAGE: Continuous Integration Version Bump
    steps:
      # zizmor: ignore[artipacked] this job pushes the version-bump commit and
      # tag, so it requires the GITHUB_TOKEN persisted by actions/checkout. Only
      # dist/ is uploaded as an artifact, not .git/, so the token is not exposed.
      - name: Checkout # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags: the version bump and release notes both read existing tags.
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Install Dependencies
        run: uv sync --locked --group dev
      - name: Bump Version
        run: |
          echo "PREVIOUS_TAG=$(git describe --tags --abbrev=0)" >> "$GITHUB_ENV"
          uv run python - <<'EOF'
          import datetime
          import os
          import subprocess
          from tomlkit.toml_file import TOMLFile
          today = datetime.datetime.now(datetime.UTC).date()
          # yyyy.m.d.patch without zero padding: PEP 440 strips leading zeros, so a padded tag wouldn't match PyPI.
          date_prefix = f"{today.year}.{today.month}.{today.day}."
          tags = subprocess.run(
              ["git", "tag", "--list", f"{date_prefix}*"], capture_output=True, text=True, check=True
          ).stdout.split()
          patch = max(int(tag.removeprefix(date_prefix)) for tag in tags) + 1 if len(tags) > 0 else 0
          new_version = f"{date_prefix}{patch}"
          file = TOMLFile("pyproject.toml")
          doc = file.read()
          doc["project"]["version"] = new_version
          file.write(doc)
          with open(os.environ["GITHUB_ENV"], "a") as env_file:
              env_file.write(f"RELEASE_TAG={new_version}\n")
          print(f"New Version: {new_version}")
          EOF
      - name: Build package
        run: uv build
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: dist/
          retention-days: 1
      - name: GIT commit and tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add pyproject.toml
          git commit -m "$CI_COMMIT_MESSAGE"
          git push
          echo "Tagging new version: $RELEASE_TAG"
          git tag -a "$RELEASE_TAG" -m "Auto-generated tag"
          git push origin "$RELEASE_TAG"
      # .github/release.yml sorts release notes by label, so label each PR merged since the previous release from its
      # conventional-commit title. Labels are only added, never removed.
      - name: Label PRs for release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          since="$(git log -1 --format=%cI "$PREVIOUS_TAG")"
          gh pr list --state merged --base main --search "merged:>$since" --limit 500 --json number,title \
            | jq -r '.[] | [.number, .title] | @tsv' \
            | while IFS=$'\t' read -r number title; do
                labels="$(.github/scripts/release_labels.sh "$title")" || continue
                for label in $labels; do
                  gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$number/labels" -f "labels[]=$label" > /dev/null
                done
                echo "#$number" $labels ": $title"
              done
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$RELEASE_TAG" --generate-notes --notes-start-tag "$PREVIOUS_TAG"
  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    environment:
      name: production
      url: "https://pypi.org/project/openretailscience"
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: dist
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
  deploy-docs:
    name: Deploy Documentation
    needs: pypi-publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: $/.github/workflows/gh-page.yml
