name: PyPi Package Deploy
on:
  workflow_dispatch:
    inputs:
      release:
        type: choice
        description: Select Release Type
        default: "minor"
        options:
          - major
          - minor
          - patch
permissions:
  contents: read
concurrency:
  group: "release"
  cancel-in-progress: false
jobs:
  pre-commit:
    name: Pre-Commit Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Run Pre-commit
        run: uv run pre-commit run --all-files

  security-audit:
    name: Dependency Security Audit
    uses: $/.github/workflows/security-audit.yml
    permissions:
      contents: read
      security-events: write

  bigquery-integration-tests:
    name: BigQuery Integration Tests
    uses: $/.github/workflows/bigquery-integration.yml
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

  databricks-integration-tests:
    name: Databricks Integration Tests
    uses: $/.github/workflows/databricks-integration.yml
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      GCP_INFRA_PROJECT_ID: ${{ secrets.GCP_INFRA_PROJECT_ID }}
      DATABRICKS_CI_HOST: ${{ secrets.DATABRICKS_CI_HOST }}
      DATABRICKS_CI_CLIENT_ID: ${{ secrets.DATABRICKS_CI_CLIENT_ID }}
      DATABRICKS_CI_HTTP_PATH: ${{ secrets.DATABRICKS_CI_HTTP_PATH }}
      DATABRICKS_CI_CATALOG: ${{ secrets.DATABRICKS_CI_CATALOG }}
      DATABRICKS_CI_SCHEMA: ${{ secrets.DATABRICKS_CI_SCHEMA }}

  pyspark-integration-tests:
    name: PySpark Integration Tests
    uses: $/.github/workflows/pyspark-integration.yml

  snowflake-integration-tests:
    name: Snowflake Integration Tests
    uses: $/.github/workflows/snowflake-integration.yml
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      GCP_INFRA_PROJECT_ID: ${{ secrets.GCP_INFRA_PROJECT_ID }}
      SNOWFLAKE_CI_ACCOUNT: ${{ secrets.SNOWFLAKE_CI_ACCOUNT }}
      SNOWFLAKE_CI_USER: ${{ secrets.SNOWFLAKE_CI_USER }}
      SNOWFLAKE_CI_WAREHOUSE: ${{ secrets.SNOWFLAKE_CI_WAREHOUSE }}
      SNOWFLAKE_CI_DATABASE: ${{ secrets.SNOWFLAKE_CI_DATABASE }}
      SNOWFLAKE_CI_SCHEMA: ${{ secrets.SNOWFLAKE_CI_SCHEMA }}

  sqlserver-integration-tests:
    name: SQL Server Integration Tests
    uses: $/.github/workflows/sqlserver-integration.yml

  oracle-integration-tests:
    name: Oracle Integration Tests
    uses: $/.github/workflows/oracle-integration.yml

  multi-python-tests:
    name: Multi-Python Version Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: |
          uv sync --locked
      - name: Run tests (excluding integration)
        run: |
          uv run pytest tests/ --ignore=tests/integration --tb=short -v

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - security-audit
      - pre-commit
      - bigquery-integration-tests
      - databricks-integration-tests
      - pyspark-integration-tests
      - snowflake-integration-tests
      - sqlserver-integration-tests
      - oracle-integration-tests
      - multi-python-tests
    permissions:
      contents: write
      id-token: write
      attestations: write
      pull-requests: write
    steps:
      # zizmor: ignore[artipacked] this job pushes the version-bump commit and
      # tag, so it requires the GITHUB_TOKEN persisted by actions/checkout. Only
      # dist/ is uploaded as an artifact, not .git/, so the token is not exposed.
      - name: Checkout # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PR labelling reads the previous release's commit date.
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Bump Version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TYPE: ${{ inputs.release }}
        run: |
          # The last published release, not the nearest tag: a run that tagged but failed to release must not
          # become the starting point, or its PRs drop out of every release's notes.
          previous_tag="$(gh release view --json tagName --jq .tagName)"
          echo "PREVIOUS_TAG=$previous_tag" >> "$GITHUB_ENV"
          # Also updates uv.lock, which pins this project's version; a stale lock fails `uv sync --locked`.
          release_tag="$(uv version --bump "$RELEASE_TYPE" --no-sync --short)"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
      # Before building and tagging, so a failure aborts before a version is attested or minted.
      - name: Label PRs for release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Adds pipefail; under the default shell a failed `gh pr list` labels nothing and passes.
        shell: bash
        run: |
          since="$(git log -1 --format=%cI "$PREVIOUS_TAG")"
          gh pr list --state merged --base main --search "merged:>$since" --limit 500 --json number,title \
            | jq -r '.[] | [.number, .title] | @tsv' \
            | while IFS=$'\t' read -r number title; do
                if ! labels="$(.github/scripts/release_labels.sh "$title" 2> /dev/null)"; then
                  echo "::warning::#$number has a non-conventional title, so it goes under Other Changes: $title"
                  continue
                fi
                for label in $labels; do
                  gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$number/labels" -f "labels[]=$label" > /dev/null
                done
                echo "#$number" $labels ": $title"
              done
      - name: Build package
        run: uv build
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: dist/
          retention-days: 1
      - name: GIT commit and tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add pyproject.toml uv.lock
          git commit -m "chore(release): $RELEASE_TAG"
          git tag -a "$RELEASE_TAG" -m "Auto-generated tag"
          # Atomic: a bump commit landing without its tag would leave main on a version that was never released.
          git push --atomic origin HEAD "$RELEASE_TAG"
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$RELEASE_TAG" --generate-notes --notes-start-tag "$PREVIOUS_TAG"
  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    environment:
      name: production
      url: "https://pypi.org/project/openretailscience"
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: dist
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
  deploy-docs:
    name: Deploy Documentation
    needs: pypi-publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: $/.github/workflows/gh-page.yml
